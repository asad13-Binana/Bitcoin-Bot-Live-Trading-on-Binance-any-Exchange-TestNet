# ARCHIVED OFFLINE-ONLY COMPOSE FILE.
# Runtime deployment must use ../docker-compose.yml from the release root.
# This profile exists only for validation, public data download, and backtesting.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.8@sha256:4d23160b501d2b34579e76f57ad75edfa274967cd0dd824ff1c1b86d8c166ab4
    restart: 'no'
    stop_grace_period: 5m
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - ./user_data:/freqtrade/user_data
    command: 'trade --logfile /freqtrade/user_data/logs/freqtrade.log --config /freqtrade/user_data/config.json
      --strategy IctSmcStrategy

      '
    profiles:
    - offline-audit
